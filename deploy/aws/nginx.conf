user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 2048; }

http {
    # CloudFront generates this header. Ignore viewer-supplied forwarding headers.
    map $http_cloudfront_viewer_address $viewer_ip {
        default $remote_addr;
        ~^\[([0-9a-fA-F:]+)\]:[0-9]+$ $1;
        ~^([0-9.]+):[0-9]+$ $1;
    }

    log_format api '$remote_addr "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log api;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $viewer_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 60s;
        }
        location /health/ {
            proxy_pass http://127.0.0.1:8080;
        }
        location / { return 404; }
    }
}
